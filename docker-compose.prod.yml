
services:
  # PostgreSQL database with pgvector + PostGIS extensions
  db:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.postgres-custom
    container_name: portfolio_db_prod
    env_file: 
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: portfolio_redis_prod
    env_file:
      - .env
    volumes:
      - redis_data_prod:/data
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Migration Init Container - Industry Best Practice: Separate Migration Phase
  # Follows 12-Factor App: Build → Release → Run phases
  # Database First Principle: Schema changes complete before application startup
  migrate:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_migrate_prod
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: "no"  # Run once and exit - critical for init containers
    command: >
      sh -c '
        echo "🔄 [MIGRATION PHASE] Starting Django migrations..." &&
        python manage.py migrate --noinput &&
        echo "✅ [MIGRATION PHASE] All migrations completed successfully" &&
        python manage.py showmigrations --plan | grep -q "\[ \]" && 
        { echo "❌ [MIGRATION PHASE] Unapplied migrations detected" && exit 1; } ||
        echo "✅ [MIGRATION PHASE] Schema validation complete - ready for application startup"
      '

  # Django web application - starts only after migrations complete
  web:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_web_prod
    user: "1000:1000"  # Explicit user mapping for static files permissions
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # FastAPI RAG service
  rag:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rag
    container_name: portfolio_rag_prod
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./rag_service/src:/app
      - ./shared:/shared
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --workers 2

  # Celery worker for background tasks - scrapers run here after migrations
  celery:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_celery_prod
    user: "1000:1000"  # Consistent user mapping with web service
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: 
      - .env
    volumes:
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "portfolio_project", "inspect", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    command: celery -A portfolio_project worker --loglevel=info --concurrency=2

  # Celery beat for periodic tasks
  celery-beat:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_celery_beat_prod
    user: "1000:1000"  # Consistent user mapping with web service
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: 
      - .env
    volumes:
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: celery -A portfolio_project beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # Flower for monitoring Celery tasks (optional in production)
  flower:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_flower_prod
    user: "1000:1000"  # Consistent user mapping with web service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: 
      - .env
    environment:
      - FLOWER_UNAUTHENTICATED_API=true
    volumes:
      - ./production_logs:/app/logs
    ports:
      - "127.0.0.1:5555:5555"  # Only accessible from localhost
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/api/workers"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: celery -A portfolio_project flower --port=5555

  # Nginx reverse proxy
  nginx:
    build:
      context: ./docker
      dockerfile: Dockerfile.nginx
    container_name: portfolio_nginx_prod
    depends_on:
      web:
        condition: service_healthy
      rag:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/letsencrypt:ro
      - ./ssl-challenges:/var/www/certbot
      - ./production_logs/nginx:/var/log/nginx
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL certificates - Production Ready
  certbot:
    image: certbot/certbot
    container_name: portfolio_certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl-challenges:/var/www/certbot
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-opaldecisionsciences.com}
      - ACME_EMAIL=${ACME_EMAIL:-opaldecisionsciences@gmail.com}
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${ACME_EMAIL:-opaldecisionsciences@gmail.com} --agree-tos --no-eff-email --force-renewal -d opaldecisionsciences.com -d www.opaldecisionsciences.com
    profiles:
      - ssl-setup
      
  # Certbot renewal service (for testing renewals)
  certbot-renew:
    image: certbot/certbot
    container_name: portfolio_certbot_renew
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl-challenges:/var/www/certbot
    command: renew --webroot --webroot-path=/var/www/certbot --quiet
    profiles:
      - ssl-renew

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  portfolio_network_prod:
    driver: bridge