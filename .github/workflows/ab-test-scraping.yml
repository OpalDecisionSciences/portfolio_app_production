name: A/B Test - Image Scraping Methods

on:
  workflow_dispatch:
    inputs:
      test_batch_size:
        description: 'Number of restaurants for A/B test'
        required: true
        default: '20'
        type: string
      enable_s3_direct:
        description: 'Enable S3-direct method'
        required: true
        default: true
        type: boolean

jobs:
  ab-test-setup:
    name: Setup A/B Testing Environment
    runs-on: ubuntu-latest
    outputs:
      test_batch_a: ${{ steps.split.outputs.batch_a }}
      test_batch_b: ${{ steps.split.outputs.batch_b }}
    
    steps:
    - name: Calculate test batches
      id: split
      run: |
        TOTAL=${{ github.event.inputs.test_batch_size }}
        BATCH_SIZE=$((TOTAL / 2))
        
        echo "batch_a=$BATCH_SIZE" >> $GITHUB_OUTPUT
        echo "batch_b=$BATCH_SIZE" >> $GITHUB_OUTPUT
        
        echo "A/B Test Configuration:"
        echo "- Total restaurants: $TOTAL"
        echo "- Batch A (current method): $BATCH_SIZE"
        echo "- Batch B (S3-direct): $BATCH_SIZE"

  test-current-method:
    name: Test A - Current Image Method
    runs-on: ubuntu-latest
    needs: ab-test-setup
    
    steps:
    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        
    - name: Run current method scraping
      run: |
        ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} << 'EOF'
          cd /home/ubuntu/portfolio_app_production
          
          echo "🧪 Starting A/B Test - Batch A (Current Method)"
          
          # Create test directory for metrics
          mkdir -p ab_test_results
          
          # Run scraping with current method
          START_TIME=$(date +%s)
          docker exec portfolio_web_prod python manage.py process_michelin_csv \
            --max-restaurants=${{ needs.ab-test-setup.outputs.test_batch_a }} \
            --start-row=0 \
            --csv-path=/app/michelin_my_maps.csv \
            > ab_test_results/batch_a_current_$(date +%Y%m%d_%H%M%S).log 2>&1
          END_TIME=$(date +%s)
          
          # Calculate metrics
          DURATION=$((END_TIME - START_TIME))
          IMAGES_COUNT=$(docker exec portfolio_web_prod python manage.py shell -c "
from restaurants.models import RestaurantImage
print(RestaurantImage.objects.filter(created_at__gte='$(date -d '5 minutes ago' --iso-8601)').count())
" | tail -1)
          
          # Store results
          cat > ab_test_results/batch_a_metrics.json << JSON
{
  "method": "current_local_temp",
  "batch_size": ${{ needs.ab-test-setup.outputs.test_batch_a }},
  "duration_seconds": $DURATION,
  "images_processed": $IMAGES_COUNT,
  "images_per_second": $(echo "scale=2; $IMAGES_COUNT / $DURATION" | bc -l),
  "timestamp": "$(date --iso-8601=seconds)"
}
JSON
          
          echo "✅ Batch A completed: $IMAGES_COUNT images in ${DURATION}s"
        EOF

  test-s3-direct-method:
    name: Test B - S3-Direct Method
    runs-on: ubuntu-latest
    needs: [ab-test-setup, test-current-method]
    if: ${{ github.event.inputs.enable_s3_direct == 'true' }}
    
    steps:
    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        
    - name: Run S3-direct method scraping
      run: |
        ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} << 'EOF'
          cd /home/ubuntu/portfolio_app_production
          
          echo "🧪 Starting A/B Test - Batch B (S3-Direct Method)"
          
          # Enable S3-direct feature flag
          docker exec portfolio_web_prod python manage.py shell << PYTHON
from restaurants.models import FeatureFlag
FeatureFlag.objects.update_or_create(
    name='s3_direct_images',
    defaults={'enabled': True, 'percentage': 100}
)
print("S3-direct enabled for testing")
PYTHON
          
          # Run scraping with S3-direct method
          START_TIME=$(date +%s)
          docker exec portfolio_web_prod python manage.py process_michelin_csv \
            --max-restaurants=${{ needs.ab-test-setup.outputs.test_batch_b }} \
            --start-row=${{ needs.ab-test-setup.outputs.test_batch_a }} \
            --csv-path=/app/michelin_my_maps.csv \
            --s3-direct \
            > ab_test_results/batch_b_s3direct_$(date +%Y%m%d_%H%M%S).log 2>&1
          END_TIME=$(date +%s)
          
          # Calculate metrics
          DURATION=$((END_TIME - START_TIME))
          IMAGES_COUNT=$(docker exec portfolio_web_prod python manage.py shell -c "
from restaurants.models import RestaurantImage
print(RestaurantImage.objects.filter(created_at__gte='$(date -d '5 minutes ago' --iso-8601)', storage_type='s3_direct').count())
" | tail -1)
          
          # Store results
          cat > ab_test_results/batch_b_metrics.json << JSON
{
  "method": "s3_direct",
  "batch_size": ${{ needs.ab-test-setup.outputs.test_batch_b }},
  "duration_seconds": $DURATION,
  "images_processed": $IMAGES_COUNT,
  "images_per_second": $(echo "scale=2; $IMAGES_COUNT / $DURATION" | bc -l),
  "timestamp": "$(date --iso-8601=seconds)"
}
JSON
          
          echo "✅ Batch B completed: $IMAGES_COUNT images in ${DURATION}s"
          
          # Reset feature flag
          docker exec portfolio_web_prod python manage.py shell << PYTHON
from restaurants.models import FeatureFlag
FeatureFlag.objects.update_or_create(
    name='s3_direct_images',
    defaults={'enabled': False, 'percentage': 0}
)
print("S3-direct disabled after test")
PYTHON
        EOF

  analyze-results:
    name: Analyze A/B Test Results
    runs-on: ubuntu-latest
    needs: [test-current-method, test-s3-direct-method]
    if: always()
    
    steps:
    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        
    - name: Generate test report
      run: |
        ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} << 'EOF'
          cd /home/ubuntu/portfolio_app_production/ab_test_results
          
          echo "📊 A/B Test Results Analysis"
          echo "============================"
          
          if [ -f "batch_a_metrics.json" ]; then
            echo "🅰️ Current Method Results:"
            cat batch_a_metrics.json | jq -r '
              "  - Method: " + .method +
              "\n  - Images: " + (.images_processed | tostring) +
              "\n  - Duration: " + (.duration_seconds | tostring) + "s" +
              "\n  - Speed: " + (.images_per_second | tostring) + " images/sec"
            '
            echo ""
          fi
          
          if [ -f "batch_b_metrics.json" ]; then
            echo "🅱️ S3-Direct Method Results:"
            cat batch_b_metrics.json | jq -r '
              "  - Method: " + .method +
              "\n  - Images: " + (.images_processed | tostring) +
              "\n  - Duration: " + (.duration_seconds | tostring) + "s" +
              "\n  - Speed: " + (.images_per_second | tostring) + " images/sec"
            '
            echo ""
          fi
          
          # Compare results if both exist
          if [ -f "batch_a_metrics.json" ] && [ -f "batch_b_metrics.json" ]; then
            echo "📈 Performance Comparison:"
            
            SPEED_A=$(cat batch_a_metrics.json | jq -r '.images_per_second')
            SPEED_B=$(cat batch_b_metrics.json | jq -r '.images_per_second')
            
            IMPROVEMENT=$(echo "scale=2; (($SPEED_B - $SPEED_A) / $SPEED_A) * 100" | bc -l)
            
            echo "  - Speed improvement: ${IMPROVEMENT}%"
            
            if (( $(echo "$IMPROVEMENT > 0" | bc -l) )); then
              echo "  - ✅ S3-direct method is faster"
              echo "  - 🎯 Recommendation: Deploy S3-direct to production"
            else
              echo "  - ❌ Current method is faster"
              echo "  - 🎯 Recommendation: Keep current method"
            fi
          fi
          
          # Create summary report
          cat > ab_test_summary.json << JSON
{
  "test_timestamp": "$(date --iso-8601=seconds)",
  "test_batch_size": ${{ github.event.inputs.test_batch_size }},
  "batch_a_metrics": $(cat batch_a_metrics.json 2>/dev/null || echo "null"),
  "batch_b_metrics": $(cat batch_b_metrics.json 2>/dev/null || echo "null"),
  "recommendation": "$(if (( $(echo "$IMPROVEMENT > 10" | bc -l) 2>/dev/null )); then echo "deploy_s3_direct"; else echo "keep_current"; fi)"
}
JSON
          
          echo "📋 Full report saved to ab_test_summary.json"
        EOF
        
    - name: Create GitHub issue with results
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          // Get test results from server
          const sshCommand = `ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} 'cat /home/ubuntu/portfolio_app_production/ab_test_results/ab_test_summary.json'`;
          
          try {
            const results = execSync(sshCommand, { encoding: 'utf8' });
            const testData = JSON.parse(results);
            
            const issueBody = `# 🧪 A/B Test Results: Image Scraping Methods
          
## Test Configuration
- **Total Restaurants**: ${{ github.event.inputs.test_batch_size }}
- **Test Date**: ${testData.test_timestamp}
- **Branch**: ${{ github.ref_name }}
- **Commit**: ${{ github.sha }}
          
## Results Summary
          
### 🅰️ Current Method (Local Temp → S3)
${testData.batch_a_metrics ? `
- **Images Processed**: ${testData.batch_a_metrics.images_processed}
- **Duration**: ${testData.batch_a_metrics.duration_seconds} seconds
- **Speed**: ${testData.batch_a_metrics.images_per_second} images/sec
` : '❌ Test failed or incomplete'}
          
### 🅱️ S3-Direct Method
${testData.batch_b_metrics ? `
- **Images Processed**: ${testData.batch_b_metrics.images_processed}
- **Duration**: ${testData.batch_b_metrics.duration_seconds} seconds
- **Speed**: ${testData.batch_b_metrics.images_per_second} images/sec
` : '❌ Test failed or incomplete'}
          
## 🎯 Recommendation
**${testData.recommendation === 'deploy_s3_direct' ? '✅ Deploy S3-Direct Method' : '🔄 Keep Current Method'}**
          
## Next Steps
- [ ] Review detailed logs in server:/home/ubuntu/portfolio_app_production/ab_test_results/
- [ ] ${testData.recommendation === 'deploy_s3_direct' ? 'Implement S3-direct for production' : 'Optimize current method'}
- [ ] Update documentation with findings
          
## Technical Details
\`\`\`json
${JSON.stringify(testData, null, 2)}
\`\`\`
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `A/B Test Results: Image Scraping Performance (${testData.recommendation})`,
              body: issueBody,
              labels: ['a/b-test', 'performance', 'infrastructure']
            });
          } catch (error) {
            console.error('Error creating issue:', error);
          }